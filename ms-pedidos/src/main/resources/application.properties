spring.application.name=ms-pedidos
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/pedidos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

services.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8081}
services.produtos.url=${PRODUTOS_SERVICE_URL:http://localhost:8082}
