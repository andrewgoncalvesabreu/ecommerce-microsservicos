server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios
              uri: http://ms-usuarios:8081
              predicates:
                - Path=/usuarios/**

            - id: produtos
              uri: http://ms-produtos:8082
              predicates:
                - Path=/produtos/**

            - id: pedidos
              uri: http://ms-pedidos:8083
              predicates:
                - Path=/pedidos/**