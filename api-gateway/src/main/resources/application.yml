server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/usuarios/**
        - id: produtos
          uri: http://localhost:8082
          predicates:
            - Path=/produtos/**
        - id: pedidos
          uri: http://localhost:8083
          predicates:
            - Path=/pedidos/**
