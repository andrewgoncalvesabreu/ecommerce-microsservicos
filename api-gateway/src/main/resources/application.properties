spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios
spring.cloud.gateway.server.webmvc.routes[0].uri=${USUARIOS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/usuarios/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-produtos
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUTOS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/produtos/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-pedidos
spring.cloud.gateway.server.webmvc.routes[2].uri=${PEDIDOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/pedidos/**
